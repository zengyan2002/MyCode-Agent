[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mycode-ai"
version = "0.1.0"
description = "A streaming terminal AI chat assistant"
requires-python = ">=3.11"
# 第三方库依赖
dependencies = [
    # 用于发送HTTP请求、支持同步、异步和流式响应
    "httpx>=0.27,<1.0",
    # 用于检查JSON数据是否符合预先定义的结构
    "jsonschema>=4.25,<5.0",
    # Model Context Protocol 的 Python SDK
    "mcp>=1.28,<2",
    # 用于读取和生成YAML
    "PyYAML>=6.0,<7.0",
    # 制作可交互的终端界面
    "prompt-toolkit>=3.0,<4.0",
    # 用于读取 .env 文件
    "python-dotenv>=1.2,<2.0",
    # 用于在终端中显示带颜色和样式的文字
    "rich>=13.7,<15.0",
]

[project.optional-dependencies]
dev = [
    # 用于发现和用于测试
    "pytest>=8.0,<10.0",
    # 让 pytest 可以运行异步测试
    "pytest-asyncio>=0.24,<2.0",
]

[project.scripts]
# 让pip安装项目时生成一个名为mycode的终端命令
mycode = "mycode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mycode.resources.skills" = ["*.md"]
"mycode.resources.agents" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
